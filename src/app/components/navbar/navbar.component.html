<div class="container-fluid px-4">
  <div class="row px-4">
    <nav class="navbar navbar-expand-lg" aria-label="Meniu principal">
      <div class="container-fluid">
        <a class="navbar-brand" routerLink="/">
          <img
            src="/assets/images/TestBakery-Logo.svg"
            class="hover-logo"
            alt="TestBakery, pagina principală"
            width="140rem"
          />
        </a>
        <app-hamburger-button
          [isOpen]="isMenuOpen()"
          (toggleMenu)="onToggleMenu($event)"
          controls="main-nav"
        ></app-hamburger-button>
        <div class="navbar-collapse" [class.show]="isMenuOpen()" id="main-nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a
                routerLink="/"
                class="nav-link hover-item"
                routerLinkActive="current-page"
                [routerLinkActiveOptions]="{ exact: true }"
                ariaCurrentWhenActive="page"
                (click)="closeMenu()"
                >ACASĂ</a
              >
            </li>
            <li class="nav-item">
              <a
                routerLink="/products"
                class="nav-link hover-item"
                routerLinkActive="current-page"
                ariaCurrentWhenActive="page"
                (click)="closeMenu()"
                >PRODUSE</a
              >
            </li>
            <li class="nav-item">
              <a
                routerLink="/contact"
                class="nav-link hover-item"
                routerLinkActive="current-page"
                ariaCurrentWhenActive="page"
                (click)="closeMenu()"
                >CONTACT</a
              >
            </li>
            <li class="nav-item">
              <a
                routerLink="/cart"
                class="nav-link hover-item"
                routerLinkActive="current-page"
                ariaCurrentWhenActive="page"
                (click)="closeMenu()"
                ><span class="cart-label"
                  >COȘ
                  <!-- Tracking the count re-creates the badge on every change, so it pops each time. -->
                  @for (count of cartCounts(); track count) {
                    <span class="badge cart-count pop"
                      >{{ count
                      }}<span class="visually-hidden"> produse</span></span
                    >
                  }
                </span></a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </div>
</div>
